<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paperclip Kids Market</title>
  <meta name="description" content="Paperclip Kids Market — browse vendors, booths and items at our community kids market.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a class="nav-logo" href="#/">
        <div class="nav-logo-icon"><img src="image/paperclip.png" alt=""></div>
        <span class="nav-logo-text" id="brand">Paperclip</span>
      </a>
      <div class="nav-tabs">
        <a class="nav-tab" href="#/shop"    data-tab="shop"><span class="nav-tab-emoji">🔍</span><span class="nav-tab-label"> Shop</span></a>
        <a class="nav-tab" href="#/map"     data-tab="map"><span class="nav-tab-emoji">🗺️</span><span class="nav-tab-label"> Map</span></a>
        <a class="nav-tab" href="#/vendors" data-tab="vendors"><span class="nav-tab-emoji">🏪</span><span class="nav-tab-label"> Vendors</span></a>
      </div>
    </div>
  </nav>

  <main class="page" id="app"></main>

  <footer class="site-footer" id="footer"></footer>

  <!-- Event details, photos and options. Edit this file to update the market. -->
  <script src="data/site.js"></script>
  <!-- Vendors and their items, generated by tools/fetch-vendors.mjs. -->
  <script src="data/vendors.js"></script>
  <!-- Categories, colors and the booth layout. -->
  <script src="js/data.js"></script>
  <!-- The app: routing and rendering. -->
  <script src="js/app.js"></script>

</body>
</html>
